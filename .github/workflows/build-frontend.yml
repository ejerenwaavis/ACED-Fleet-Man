name: Build Frontend

on:
  push:
    branches: [rogue-enhance]
    paths: ['frontend/**']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rogue-enhance

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (static export)
        working-directory: frontend
        run: npm run build

      - name: Sync build output into public/
        run: |
          rsync -a --delete frontend/out/ public/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes to public/, nothing to commit."
          else
            git commit -m "chore: rebuild frontend into public/ [auto]"
            git push origin HEAD:rogue-enhance
          fi